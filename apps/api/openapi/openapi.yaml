openapi: 3.1.0
info:
  title: YAFA VANAM Commerce API
  version: 1.0.0
  description: Catalogue, anonymous cart, and checkout-order API for the YAFA VANAM storefront.
servers:
  - url: http://localhost:4000/api/v1
paths:
  /categories:
    get:
      summary: List the active catalogue taxonomy
      responses:
        "200":
          description: Category list
  /products:
    get:
      summary: Search and filter active products
      parameters:
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: subcategory, schema: { type: string } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Paginated product list
  /products/{slug}:
    get:
      summary: Get an active product with its variants
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: Product }
        "404": { $ref: "#/components/responses/NotFound" }
  /carts:
    post:
      summary: Create an anonymous cart
      responses:
        "201":
          description: New cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /carts/{cartId}:
    get:
      summary: Read a cart with server-calculated prices
      parameters:
        - $ref: "#/components/parameters/CartId"
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "404": { $ref: "#/components/responses/NotFound" }
  /carts/{cartId}/items:
    post:
      summary: Add a validated product variant to a cart
      parameters:
        - $ref: "#/components/parameters/CartId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [product_id, variant_id, quantity]
              properties:
                product_id: { type: string }
                variant_id: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Variant is unavailable }
  /carts/{cartId}/items/{variantId}:
    parameters:
      - $ref: "#/components/parameters/CartId"
      - in: path
        name: variantId
        required: true
        schema: { type: string }
    patch:
      summary: Set a cart line quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove a cart line
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders:
    post:
      summary: Create a pending-payment order from a server-priced cart
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrder" }
      responses:
        "201": { description: Order created }
        "200": { description: Existing order returned after an idempotent replay }
        "422": { description: Invalid checkout data or empty cart }
  /orders/{orderNumber}:
    get:
      summary: Read an order using its private access token
      parameters:
        - in: path
          name: orderNumber
          required: true
          schema: { type: string }
        - in: header
          name: X-Order-Access-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Order }
        "403": { description: Missing or invalid order access token }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  parameters:
    CartId:
      in: path
      name: cartId
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    CartLine:
      type: object
      required: [key, product_id, variant_id, name, slug, currency, unit_price, quantity]
      properties:
        key: { type: string }
        product_id: { type: string }
        variant_id: { type: string }
        name: { type: string }
        slug: { type: string }
        product_type: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        unit_price: { type: number, minimum: 0 }
        quantity: { type: integer, minimum: 1, maximum: 20 }
        size: { type: [string, "null"] }
        shade: { type: [string, "null"] }
        image: { type: [string, "null"] }
    Cart:
      type: object
      required: [id, items, item_count, subtotal, currency, updated_at]
      properties:
        id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CartLine" }
        item_count: { type: integer, minimum: 0 }
        subtotal: { type: number, minimum: 0 }
        currency: { type: string }
        updated_at: { type: string, format: date-time }
    Address:
      type: object
      additionalProperties: false
      required: [recipient_name, line1, city, state_region, postal_code]
      properties:
        recipient_name: { type: string }
        phone: { type: [string, "null"] }
        line1: { type: string }
        line2: { type: [string, "null"] }
        city: { type: string }
        state_region: { type: string }
        postal_code: { type: string }
        country_code: { type: string, minLength: 2, maxLength: 2, default: IN }
    CreateOrder:
      type: object
      additionalProperties: false
      required: [cart_id, customer_email, shipping_address]
      properties:
        cart_id: { type: string }
        customer_email: { type: string, format: email }
        shipping_address: { $ref: "#/components/schemas/Address" }
