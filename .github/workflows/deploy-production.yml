name: Deploy YAFA VANAM production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: yafa-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r services/recommendation-engine/requirements.txt
      - run: python -m pytest services/recommendation-engine/tests -q
      - run: npm run typecheck
      - run: npm run build:web
      - run: cd apps/api && go test ./...

  deploy:
    name: Build and deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::758388043025:role/yafa-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Resolve account-scoped registry
        run: echo "ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
      - name: Build and publish immutable images
        env:
          TAG: ${{ github.sha }}
        run: |
          docker build -f apps/api/Dockerfile -t "$ECR_REGISTRY/yafa-api:$TAG" .
          docker build -f apps/web/Dockerfile -t "$ECR_REGISTRY/yafa-web:$TAG" .
          docker build -f services/recommendation-engine/Dockerfile -t "$ECR_REGISTRY/yafa-advisor:$TAG" .
          docker push "$ECR_REGISTRY/yafa-api:$TAG"
          docker push "$ECR_REGISTRY/yafa-web:$TAG"
          docker push "$ECR_REGISTRY/yafa-advisor:$TAG"
      - name: Roll out safely through Auto Scaling
        env:
          TAG: ${{ github.sha }}
        run: |
          LAUNCH_TEMPLATE_ID="lt-0e3c82ebc96c3b62b"
          sed "s/^IMAGE_TAG=production$/IMAGE_TAG=$TAG/" infra/aws/ec2-user-data.sh > /tmp/yafa-ec2-user-data.sh
          USER_DATA=$(base64 -w0 /tmp/yafa-ec2-user-data.sh)
          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id "$LAUNCH_TEMPLATE_ID" \
            --source-version '$Latest' \
            --version-description "$GITHUB_SHA" \
            --launch-template-data "{\"UserData\":\"$USER_DATA\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name yafa-prod-app \
            --strategy Rolling \
            --desired-configuration "LaunchTemplate={LaunchTemplateId=$LAUNCH_TEMPLATE_ID,Version=$NEW_VERSION}" \
            --preferences MinHealthyPercentage=50,InstanceWarmup=180,AutoRollback=true,SkipMatching=true \
            --query InstanceRefreshId --output text)
          for attempt in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name yafa-prod-app \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "Instance refresh status: $STATUS"
            case "$STATUS" in
              Successful) exit 0 ;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful) exit 1 ;;
            esac
            sleep 30
          done
          echo "Instance refresh did not finish within 30 minutes" >&2
          exit 1
