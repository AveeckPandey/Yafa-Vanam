name: Deploy YAFA VANAM production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: yafa-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 758388043025.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
      - run: cd apps/api && go test ./...

  deploy:
    name: Build and deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose AWS deployment identity
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(JSON.stringify({
              sub: claims.sub,
              aud: claims.aud,
              repository: claims.repository,
              ref: claims.ref,
              environment: claims.environment
            }));
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::758388043025:role/yafa-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish immutable and production images
        env:
          TAG: ${{ github.sha }}
        run: |
          docker build -f apps/api/Dockerfile -t "$ECR_REGISTRY/yafa-api:$TAG" -t "$ECR_REGISTRY/yafa-api:production" .
          docker build -f apps/web/Dockerfile -t "$ECR_REGISTRY/yafa-web:$TAG" -t "$ECR_REGISTRY/yafa-web:production" .
          docker build -f services/recommendation-engine/Dockerfile -t "$ECR_REGISTRY/yafa-advisor:$TAG" -t "$ECR_REGISTRY/yafa-advisor:production" services/recommendation-engine
          docker push --all-tags "$ECR_REGISTRY/yafa-api"
          docker push --all-tags "$ECR_REGISTRY/yafa-web"
          docker push --all-tags "$ECR_REGISTRY/yafa-advisor"
      - name: Roll out safely through Auto Scaling
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name yafa-prod-app \
            --strategy Rolling \
            --preferences MinHealthyPercentage=50,InstanceWarmup=180
