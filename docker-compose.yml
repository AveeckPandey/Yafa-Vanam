services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yafa_vanam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yafa_vanam"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 4000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/yafa_vanam?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-this-local-development-secret-to-a-long-random-value
      YAFA_CATALOGUE_PATH: /app/data/processed/Product.json
      RECOMMENDATION_ENGINE_URL: http://recommendation-engine:8000
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
      - recommendation-engine

  redis:
    image: redis:7-alpine

  recommendation-engine:
    build:
      context: .
      dockerfile: services/recommendation-engine/Dockerfile
    ports:
      - "8000:8000"

volumes:
  postgres_data:
