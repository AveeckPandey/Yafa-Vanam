services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yafa_vanam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yafa_vanam"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Product-knowledge RAG store. Must be a pgvector build; the commerce
  # database above intentionally stays extension-free. Host port 5433 avoids
  # colliding with the commerce Postgres.
  rag-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: #################
      POSTGRES_DB: yafa_rag
    ports:
      - "5433:5432"
    volumes:
      - rag_vector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yafa_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 4000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/yafa_vanam?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-this-local-development-secret-to-a-long-random-value
      APP_ENV: development
      APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
      YAFA_CATALOGUE_PATH: /app/data/processed/Product.json
      YAFA_INTERNAL_SERVICE_TOKEN: ${YAFA_INTERNAL_SERVICE_TOKEN:-local-development-token-must-be-at-least-32-characters}
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  redis:
    image: redis:7-alpine

  yafa-rag:
    build:
      context: .
      dockerfile: services/recommendation-engine/Dockerfile
    environment:
      YAFA_INTERNAL_SERVICE_TOKEN: ${YAFA_INTERNAL_SERVICE_TOKEN:-local-development-token-must-be-at-least-32-characters}
      # Keep local Docker RAG on its dedicated pgvector service.  A workstation
      # .env may hold a remote vector URL for non-Docker use and must not make
      # this local stack depend on external network reachability.
      VECTOR_DATABASE_URL: ${RAG_DOCKER_DATABASE_URL:-postgresql://postgres:postgres@rag-postgres:5432/yafa_rag}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-false}
    # Local-only bridge for the Next.js server running on the host. The RAG
    # endpoints remain token-protected and are not exposed to the LAN.
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      - rag-postgres

volumes:
  postgres_data:
  rag_vector_data:
